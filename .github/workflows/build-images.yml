name: Build PL2 Mainline Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - qcom-sdm660-7.2.y

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            python3 \
            zip

      - name: Configure kernel
        run: |
          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            defconfig sdm660_defconfig

      - name: Build kernel
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz \
            dtbs \
            modules

      - name: Install modules
        run: |
          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules" \
            modules_install

      - name: Show build output
        run: |
          echo "===== KERNEL ====="
          ls -lh out/arch/arm64/boot/Image.gz

          echo
          echo "===== DTBS ====="
          find out/arch/arm64/boot/dts \
            -type f \
            -name '*.dtb' \
            -exec ls -lh {} \;

          echo
          echo "===== MODULES ====="
          du -sh modules/

      - name: Package build output
        if: always()
        continue-on-error: true
        run: |
          if [ -d out ]; then
            zip -r out.zip out
          else
            echo "out/ does not exist; nothing to package"
            exit 1
          fi

      - name: Upload build output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PL2-mainline-out
          path: out.zip
          if-no-files-found: error

      - name: Commit build output
        if: always()
        continue-on-error: true
        run: |
          if [ ! -d out ]; then
            echo "out/ does not exist; nothing to commit"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/

          if git diff --cached --quiet; then
            echo "No changes in out/ to commit"
          else
            git commit -m "ci: commit kernel build output [skip ci]"
            git push
          fi
