```yaml
name: Build PL2 Mainline Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - qcom-sdm660-7.2.y

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            python3

      - name: Configure kernel
        run: |
          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            defconfig sdm660_defconfig

      - name: Build kernel
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz \
            dtbs \
            modules

      - name: Install modules
        run: |
          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules" \
            modules_install

      - name: Show build output
        run: |
          echo "===== KERNEL ====="
          ls -lh out/arch/arm64/boot/Image.gz

          echo
          echo "===== DTBS ====="
          find out/arch/arm64/boot/dts \
            -type f \
            -name '*.dtb' \
            -exec ls -lh {} \;

          echo
          echo "===== MODULES ====="
          du -sh modules/

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: PL2-mainline-Image.gz
          path: out/arch/arm64/boot/Image.gz
          if-no-files-found: error

      - name: Upload DTBs
        uses: actions/upload-artifact@v4
        with:
          name: PL2-mainline-DTBS
          path: out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: error

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: PL2-mainline-modules
          path: modules/
          if-no-files-found: error

      - name: Upload kernel config
        uses: actions/upload-artifact@v4
        with:
          name: PL2-mainline-config
          path: out/.config
          if-no-files-found: error
```
