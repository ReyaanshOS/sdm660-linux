name: Build PL2 Linux Kernel

on:
  push:
    branches:
      - qcom-sdm660-7.*.y
    tags:
      - "v*-pl2"
  pull_request:
    branches:
      - qcom-sdm660-7.*.y
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            ccache \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Prepare kernel configuration
        run: |
          mkdir -p .output
          make O=.output \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION= \
            sdm660_defconfig

      - name: Build kernel
        run: |
          make O=.output \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION= \
            -j"$(nproc)"

      - name: Build Image.gz
        run: |
          make O=.output \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION= \
            -j"$(nproc)" \
            Image.gz

      - name: Collect kernel files
        run: |
          mkdir -p release

          cp .output/arch/arm64/boot/Image.gz \
            release/Image.gz

          find .output/arch/arm64/boot/dts/qcom \
            -type f -name '*.dtb' \
            -exec cp --parents {} release/ \;

          tar -czf pl2-linux-kernel.tar.gz -C release .

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: pl2-linux-kernel
          path: |
            release/
            pl2-linux-kernel.tar.gz
          compression-level: 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Image.gz
            pl2-linux-kernel.tar.gz
          generate_release_notes: true
